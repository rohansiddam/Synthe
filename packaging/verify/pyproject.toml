[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthe-verify"
version = "0.6.0"
description = "Offline, stdlib-only verification of Synthe receipt chains"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
synthe-verify = "synthe_verify:main"

[tool.setuptools]
py-modules = ["synthe_verify"]

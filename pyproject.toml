[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthe"
version = "0.6.0"
description = "The commit barrier for AI agents: agents propose, Synthe commits, anyone can verify."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND LicenseRef-FSL-1.1-ALv2"  # LICENSING.md: which file is which
license-files = ["LICENSE", "LICENSE-FSL.md", "LICENSING.md"]
# The checker runs on the stdlib alone (pure-Python Ed25519); the broker wants the fast path.
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
synthe-check = "handoff_check:main"
synthe-sign = "synthe_sign:main"
synthe-commit = "synthe_commit:main"
synthe-client = "synthe_client:main"
synthe-mcp = "synthe_mcp:main"
synthe-a2a = "synthe_a2a:main"
synthe-approve = "synthe_approve:main"
synthe-approver = "synthe_approver:main"
synthe-init = "synthe_init:main"
synthe-task = "synthe_task:main"
git-remote-synthe = "synthe_git_remote:main"
synthe-verify = "synthe_verify:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "handoff_check", "synthe_crypto", "synthe_sign", "synthe_plan", "synthe_commit",
  "synthe_broker", "synthe_client", "synthe_mcp", "synthe_a2a", "synthe_approve",
  "synthe_init", "synthe_task", "synthe_ui", "synthe_git_remote", "synthe_touchid",
  "synthe_lane_templates", "synthe_approver", "synthe_verify",
]

[tool.setuptools.data-files]
"share/synthe" = ["src/synthe_commit_ui.html", "schema/handoff.schema.json"]
"share/synthe/openclaw" = ["integrations/openclaw/README.md"]
"share/synthe/openclaw/plugin" = [
  "integrations/openclaw/plugin/package.json", "integrations/openclaw/plugin/openclaw.plugin.json",
  "integrations/openclaw/plugin/index.ts", "integrations/openclaw/plugin/policy.ts",
  "integrations/openclaw/plugin/broker.ts",
]
"share/synthe/openclaw/skill/synthe" = ["integrations/openclaw/skill/synthe/SKILL.md"]
# Setup must also work from a wheel, outside a source checkout. These are product assets only.
"share/synthe/source/src" = ["src/*.py", "src/*.html"]
"share/synthe/source/deploy/macos" = ["deploy/macos/*.sh"]
"share/synthe/source/deploy/linux" = ["deploy/linux/install.sh", "deploy/linux/finish.sh", "deploy/linux/*.service"]
"share/synthe/source/integrations/macos/touchid" = ["integrations/macos/touchid/*.swift"]
"share/synthe/source/integrations/openclaw/plugin" = [
  "integrations/openclaw/plugin/package.json", "integrations/openclaw/plugin/openclaw.plugin.json",
  "integrations/openclaw/plugin/index.ts", "integrations/openclaw/plugin/policy.ts", "integrations/openclaw/plugin/broker.ts",
]
"share/synthe/source/integrations/openclaw/skill/synthe" = ["integrations/openclaw/skill/synthe/SKILL.md"]
"share/synthe/claude-code/.claude-plugin" = ["integrations/claude-code/.claude-plugin/plugin.json"]
"share/synthe/claude-code" = ["integrations/claude-code/.mcp.json", "integrations/claude-code/README.md"]
"share/synthe/claude-code/hooks" = ["integrations/claude-code/hooks/hooks.json", "integrations/claude-code/hooks/pre_tool_use.py"]
"share/synthe/claude-code/skills/synthe" = ["integrations/claude-code/skills/synthe/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

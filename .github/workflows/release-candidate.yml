name: Build private release candidates (never publish)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build pytest cryptography
      - run: python -m pytest -q -p no:cacheprovider tests/test_synthe_verify.py tests/test_claude_plugin.py tests/test_release_packaging.py
      - run: python -m build --outdir dist/broker
      - run: python scripts/build_verifier.py --outdir dist/verifier
      - run: sha256sum dist/broker/* dist/verifier/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: synthe-private-candidates
          path: dist/
# Intentionally no tag trigger, publish token, id-token permission, release creation or PyPI upload.
# Public artifacts must be rebuilt from the founders-approved public export, not from this private ref.
